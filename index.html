    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#000000" id="theme-color-meta">
    
    <title>WAIT FOR IT...</title>
    <meta name="description" content="Vessel 3 is available now! Check the vessel and be part of iT - 3ULT.">
    
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- ZMIENNE RESPONSYWNE --- */
        :root {
            --light-size: 400px;
            --light-offset: -200px;
            --blur-max: 30px;
            --beam-C-Y: 0vh;  
            --beam-L-X: -32vw; --beam-L-Y: 0vh;
            --beam-R-X: 32vw;  --beam-R-Y: 0vh;
        }

        html {
            background-color: #000000; 
            width: 100%;
            height: 100%;
            height: -webkit-fill-available; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            transition: background-color 0.4s ease; 
        }

        body {
            background-color: #000000;
            color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            min-height: -webkit-fill-available; 
            margin: 0;
            padding: 0;
            overflow: hidden; 
            overscroll-behavior: none; 
            transition: background-color 0.4s ease;
        }

        /* SZTUCZNE KREMOWE TŁO DLA EFEKTU ŚWIATŁA */
        .cream-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #faf0e6;
            z-index: 0; 
            pointer-events: none;
        }

        .paint-drips-container {
            position: fixed;
            inset: 0;
            z-index: 1; 
            pointer-events: none;
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), filter 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .drip-group { position: absolute; width: 0; height: 0; }

        .drip {
            position: absolute;
            background-color: #990000;
            border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%;
            opacity: 0;
            transform-origin: center;
            animation: liquidSplat 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes liquidSplat {
            0%   { transform: scale(1.5) translateY(-15px); opacity: 0; }
            5%   { transform: scale(1.1) translateY(0); opacity: 1; } 
            10%  { transform: scale(1) translateY(0); opacity: 1; }   
            70%  { transform: scale(1) translateY(0); opacity: 1; }   
            100% { transform: scale(0.9) translateY(0); opacity: 0; } 
        }

        /* --- LOGO GŁÓWNE --- */
        .main-logo-large {
            position: absolute;
            top: 2vh; 
            left: 50%;
            transform: translateX(-50%);
            max-width: 300px; 
            width: 60vw; 
            height: auto; 
            z-index: 10;
            cursor: pointer;
            transition: filter 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        .main-logo-large:hover {
            filter: drop-shadow(0 0 10px rgba(153, 0, 0, 0.4));
        }

        /* --- GŁÓWNY KONTENER TEKSTÓW --- */
        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            z-index: 10;
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), filter 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .gothic-text { font-family: 'UnifrakturCook', cursive; font-weight: 700; }
        
        .dev-phase-note {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 5vh;
            text-transform: lowercase;
            visibility: hidden; 
            opacity: 0;
            pointer-events: none;
        }

        .coming-soon-container {
            color: #990000; font-size: 32px; letter-spacing: 4px; text-transform: lowercase; 
            display: flex; justify-content: center; flex-wrap: wrap; text-align: center; gap: 15px; margin-bottom: 1vh;
            white-space: normal;
        }

        .part-of-it {
            color: #000000; font-size: 26px; letter-spacing: 2px; text-transform: lowercase;
            text-align: center; margin-bottom: 0; 
            white-space: nowrap; 
        }

        .countdown {
            display: flex; gap: 20px; color: #000000; min-height: 60px; 
            transition: opacity 0.4s ease;
        }

        .countdown div {
            display: flex; flex-direction: column; align-items: center; width: 65px; 
        }

        .countdown-number {
            font-family: 'UnifrakturCook', cursive; font-weight: 700; font-size: 36px;
            font-variant-numeric: tabular-nums; 
        }

        .countdown-label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 10px;
            letter-spacing: 2px; text-transform: uppercase; color: #666; margin-top: 5px;
        }

        /* --- KONTENER CTA Z TRZEMA KROPKAMI --- */
        .cta-container {
            position: absolute;
            bottom: 15vh;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            z-index: 10;
            white-space: nowrap;
            max-width: 94vw;
            transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), filter 0.65s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .cta-link {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2.5px;
            text-transform: lowercase;
            text-decoration: none;
            color: #333333;
            background: none;
            border: none;
            padding: 8px 4px;
            cursor: pointer;
            transition: color 0.4s ease, text-shadow 0.4s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1), letter-spacing 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            -webkit-tap-highlight-color: transparent;
        }

        .cta-link:hover,
        .cta-link.touch-active {
            color: #990000;
            text-shadow: 0 0 10px rgba(153, 0, 0, 0.45);
            transform: scale(1.03);
        }

        .cta-separator {
            color: #990000;
            font-size: 9px;
            line-height: 1;
            opacity: 0.75;
            user-select: none;
            text-shadow: 0 0 6px rgba(153, 0, 0, 0.3);
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
        }

        .cta-container:hover .cta-separator {
            opacity: 0.95;
        }

        .footer {
            position: absolute; 
            bottom: 20px; 
            font-size: 11px; 
            color: #aaa; 
            letter-spacing: 3px; 
            z-index: 10;
            transition: bottom 0.3s ease, opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .subtle-link {
            position: fixed;
            bottom: 20px;
            z-index: 10; 
            color: #888; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-decoration: none;
            transition: color 0.4s ease, text-shadow 0.4s ease, opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1), filter 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .link-left { left: 5vw; }
        .link-right { right: 5vw; }

        .subtle-link:hover {
            color: #990000; 
            text-shadow: 0 0 8px rgba(153, 0, 0, 0.4);
        }

        /* --- SMOOTH ANIMACJA PRZEJŚCIA PO KLIKNIĘCIU (W STYLU STRONY BEANIE) --- */
        body.is-leaving .content-wrapper {
            opacity: 0;
            transform: scale(1.06);
            filter: blur(8px);
            pointer-events: none;
        }

        body.is-leaving .cta-container {
            opacity: 0;
            transform: translateX(-50%) scale(1.08);
            filter: blur(8px);
            pointer-events: none;
        }

        body.is-leaving .cta-link.touch-active {
            letter-spacing: 4.5px;
            color: #990000;
            text-shadow: 0 0 14px rgba(153, 0, 0, 0.7);
        }

        body.is-leaving .main-logo-large {
            opacity: 0;
            transform: translateX(-50%) scale(0.96);
            filter: blur(6px);
            pointer-events: none;
        }

        body.is-leaving .paint-drips-container,
        body.is-leaving .footer,
        body.is-leaving .subtle-link {
            opacity: 0;
            filter: blur(4px);
            pointer-events: none;
        }

        /* --- BAZOWA MASKA ŚWIATŁA --- */
        .spotlight-wrapper {
            position: fixed; 
            top: -20vh; bottom: -20vh; left: -20vw; right: -20vw; 
            z-index: 500; 
            pointer-events: none; 
            mix-blend-mode: multiply; 
            opacity: 1;
        }
        .lights-container {
            width: 100%; height: 100%; background-color: #000000; 
        }
        .light {
            position: absolute; top: 50%; left: 50%; width: var(--light-size); height: var(--light-size);
            margin-top: var(--light-offset); margin-left: var(--light-offset);
            border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; 
            background: radial-gradient(circle at center, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 45%, rgba(0,0,0,1) 65%);
            mix-blend-mode: screen; 
            opacity: 0; 
        }

        /* --- AKTYWACJA ANIMACJI --- */
        body.anim-ready .spotlight-wrapper { animation: removeDarkness 2s both; }
        body.anim-ready .lights-container { animation: lightsFlicker 2s both; }
        body.anim-ready .light { animation: shapeWobble 1s infinite linear alternate-reverse both; }
        body.anim-ready .center-beam { animation: beamCenter 2s ease-in-out both, diffuseLight 2s ease-in-out both; }
        body.anim-ready .left-beam { animation: beamLeft 2s ease-in-out both, diffuseLight 2s ease-in-out both; }
        body.anim-ready .right-beam { animation: beamRight 2s ease-in-out both, diffuseLight 2s ease-in-out both; }
        
        @keyframes shapeWobble { to { border-radius: 60% 40% 30% 70% / 60% 50% 70% 30%; } }

        @keyframes beamCenter {
            0%, 10% { transform: translate(0, 0); opacity: 0; } 
            15%, 25% { transform: translate(0, 0); opacity: 1; }
            40%, 100% { transform: translate(0, var(--beam-C-Y)); opacity: 1; }
        }
        @keyframes beamLeft {
            0%, 25% { transform: translate(0, 0); opacity: 0; } 
            26% { transform: translate(0, 0); opacity: 1; } 
            40%, 100% { transform: translate(var(--beam-L-X), var(--beam-L-Y)); opacity: 1;} 
        }
        @keyframes beamRight {
            0%, 25% { transform: translate(0, 0); opacity: 0; } 
            26% { transform: translate(0, 0); opacity: 1; } 
            40%, 100% { transform: translate(var(--beam-R-X), var(--beam-R-Y)); opacity: 1;}  
        }
        
        @keyframes diffuseLight { 
            0%, 50% { filter: blur(2px); } 
            100% { filter: blur(var(--blur-max)); } 
        }
        
        @keyframes lightsFlicker {
            0%, 65% { opacity: 1; } 
            66%, 70% { opacity: 0.1; } 
            71%, 75% { opacity: 1; } 
            76%, 80% { opacity: 0.1; } 
            81%, 85% { opacity: 1; } 
            86%, 90% { opacity: 0.1; } 
            91%, 100% { opacity: 1; }
        }
        
        @keyframes removeDarkness { 
            0%, 92% { opacity: 1; } 
            100% { opacity: 0; visibility: hidden; } 
        }

        /* --- MEDIA QUERIES (MOBILE) --- */
        @media (max-width: 768px) {
            :root {
                --light-size: 260px; 
                --light-offset: -130px;
                --blur-max: 20px;
                --beam-C-Y: 0vh;  
                --beam-L-X: 0vw;   --beam-L-Y: -35vh;
                --beam-R-X: 0vw;   --beam-R-Y: 35vh;  
            }

            .main-logo-large { top: 4vh; width: 78vw; max-width: 260px; }
            .coming-soon-container { font-size: clamp(22px, 6.5vw, 28px); letter-spacing: 1px; gap: 5px; }
            .part-of-it { font-size: clamp(18px, 5vw, 23px); }
            .countdown { gap: 12px; }
            .countdown div { width: 55px; }
            .countdown-number { font-size: 30px; }
            .footer { display: none; }
            
            .cta-container {
                bottom: 12vh;
                gap: clamp(8px, 2.8vw, 14px);
                width: 94vw;
            }

            .cta-link {
                font-size: clamp(10px, 3vw, 11.5px);
                letter-spacing: clamp(1px, 0.4vw, 1.5px);
                padding: 10px 2px;
            }

            .cta-separator {
                font-size: 8px;
            }

            body.is-leaving .cta-link.touch-active {
                letter-spacing: 2.5px;
            }

            .subtle-link { bottom: 18px; font-size: 10px; letter-spacing: 1px; }
            .link-left { left: 5vw; }
            .link-right { right: 5vw; }
        }

        @media (max-width: 360px) {
            .cta-container { gap: 6px; }
            .cta-link { font-size: 9.5px; letter-spacing: 0.8px; }
        }
    </style>
</head>
<body>

    <div class="cream-bg"></div>

    <div class="paint-drips-container" id="paint-drips-container"></div>
    <div class="spotlight-wrapper">
        <div class="lights-container">
            <div class="light center-beam"></div>
            <div class="light left-beam"></div>
            <div class="light right-beam"></div>
        </div>
    </div>

    <!-- LOGO GŁÓWNE -->
    <img src="logowektor.svg" alt="3ULT LOGO" class="main-logo-large">

    <!-- KONTENER GŁÓWNY Z TEKSTAMI -->
    <div class="content-wrapper">
        <div class="dev-phase-note">* website in development</div>
        
        <div id="content-to-center" style="display: flex; flex-direction: column; align-items: center; width: 100%; transform: translateY(-60px);">
            <div class="coming-soon-container gothic-text">
                <span>vessel 3</span>
                <span>is coming...</span>
            </div>
            <div class="part-of-it gothic-text">be part of it.</div>
        </div>
        
        <div id="countdown" class="countdown"></div>
    </div>

    <!-- KONTENER CTA Z TRZEMA CZERWONYMI KROPKAMI (PO LEWEJ, W ŚRODKU I PO PRAWEJ) -->
    <div class="cta-container">
        <span class="cta-separator">&bull;</span>
        <a href="updated1.html" class="cta-link cta-anim-link">explore vessels</a>
        <span class="cta-separator">&bull;</span>
        <a href="beanie.html" class="cta-link cta-anim-link">check accessories</a>
        <span class="cta-separator">&bull;</span>
    </div>

    <a href="about.html" class="subtle-link link-left">about...</a>
    <a href="terms.html" class="subtle-link link-right">terms & privacy</a>

    <div class="footer">3ULT /// 2026</div>

    <script>
        const countDownDate = new Date("September 13, 2026 18:00:00").getTime();
        const dripsContainer = document.getElementById("paint-drips-container");
        let intervalId;

        function createDripGroup() {
            const group = document.createElement("div");
            group.className = "drip-group";
            group.style.left = `${10 + Math.random() * 80}vw`;
            group.style.top = `${10 + Math.random() * 80}vh`;
            group.style.transform = `rotate(${Math.random() * 360}deg)`;

            const uniformSize = 10 + Math.random() * 8; 
            const drops = [
                { dx: 0, dy: 0, delay: 0 }, 
                { dx: -10 - Math.random() * 5, dy: 8 + Math.random() * 5, delay: 0.15 + Math.random() * 0.3 }, 
                { dx: 12 + Math.random() * 5, dy: -5 - Math.random() * 5, delay: 0.3 + Math.random() * 0.4 }   
            ];

            drops.forEach(drop => {
                const drip = document.createElement("div");
                drip.className = "drip";
                drip.style.left = `${drop.dx}px`;
                drip.style.top = `${drop.dy}px`;
                drip.style.width = `${uniformSize}px`;
                drip.style.height = `${uniformSize}px`;
                drip.style.animationDelay = `${drop.delay}s`; 
                group.appendChild(drip);
            });

            dripsContainer.appendChild(group);
            setTimeout(() => { if (group.parentNode) group.parentNode.removeChild(group); }, 6000);
        }

        let continueSpawning = true;
        function spawnLoop() {
            if (!continueSpawning) return; 
            createDripGroup();
            setTimeout(spawnLoop, (3 + Math.random() * 2) * 1000);
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const formatTime = (time) => time < 10 ? "0" + time : time;
            
            const countdownEl = document.getElementById("countdown");
            
            if (countdownEl) {
                countdownEl.innerHTML = 
                    "<div><span class='countdown-number'>" + formatTime(Math.floor(distance / (1000 * 60 * 60 * 24))) + "</span><span class='countdown-label'>days</span></div>" + 
                    "<div><span class='countdown-number'>" + formatTime(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))) + "</span><span class='countdown-label'>hours</span></div>" + 
                    "<div><span class='countdown-number'>" + formatTime(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))) + "</span><span class='countdown-label'>mins</span></div>" + 
                    "<div><span class='countdown-number'>" + formatTime(Math.floor((distance % (1000 * 60)) / 1000)) + "</span><span class='countdown-label'>secs</span></div>";
            }

            if (distance < 0) {
                if (countdownEl) countdownEl.style.display = "none";

                const originalContent = document.getElementById('content-to-center');
                if (originalContent) {
                    originalContent.style.transition = "transform 0.5s ease-in-out";
                    originalContent.style.transform = "translateY(-15px)";
                }
                
                const comingSoon = originalContent.querySelector('.coming-soon-container');
                if (comingSoon) {
                    comingSoon.innerHTML = "<span>VESSEL 3 is now live</span>";
                    comingSoon.style.textTransform = "none";
                }
                
                const partOfIt = originalContent.querySelector('.part-of-it');
                if (partOfIt) {
                    partOfIt.innerHTML = "be part of it.";
                }
                
                clearInterval(intervalId);
            }
        }

        // Smooth morph-out przy kliknięciu w linki CTA (na komputerze i na telefonie)
        document.querySelectorAll('.cta-anim-link, .subtle-link').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const targetUrl = this.href;
                this.classList.add('touch-active');
                document.body.classList.add('is-leaving');

                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 580);
            });
        });

        // Reset stanu po cofnięciu strony w przeglądarce (np. gest powrotu na telefonie)
        window.addEventListener('pageshow', () => {
            document.body.classList.remove('is-leaving');
            document.querySelectorAll('.touch-active').forEach(el => el.classList.remove('touch-active'));
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateCountdown(); 
            intervalId = setInterval(updateCountdown, 1000);
        });

        window.addEventListener('load', () => {
            const metaTheme = document.getElementById('theme-color-meta');

            if (window.location.search.includes('skipAnim=true')) {
                const spotlight = document.querySelector('.spotlight-wrapper');
                if (spotlight) spotlight.style.display = 'none';
                
                if(metaTheme) metaTheme.setAttribute('content', '#faf0e6');
                document.documentElement.style.backgroundColor = '#faf0e6';
                document.body.style.backgroundColor = '#faf0e6';
                
                const langWrap = document.getElementById('lang-toggle-wrapper');
                if (langWrap) langWrap.style.opacity = '1';
                
                spawnLoop();
            } else {
                requestAnimationFrame(() => {
                    document.body.classList.add('anim-ready');
                    spawnLoop(); 
                    
                    setTimeout(() => {
                        if(metaTheme) metaTheme.setAttribute('content', '#faf0e6');
                        document.documentElement.style.backgroundColor = '#faf0e6';
                        document.body.style.backgroundColor = '#faf0e6';
                        
                        const langWrap = document.getElementById('lang-toggle-wrapper');
                        if (langWrap) langWrap.style.opacity = '1';
                    }, 1840); 
                });
            }
        });
    </script>
  <style>
    #lang-toggle-wrapper {
        position: fixed;
        top: 5vh;
        right: 5vw;
        z-index: 200; 
        opacity: 0; 
        transition: opacity 0.5s ease, filter 0.6s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: lowercase;
        color: #888;
        user-select: none;
    }

    body.is-leaving #lang-toggle-wrapper {
        opacity: 0 !important;
        filter: blur(4px);
        pointer-events: none;
    }
    
    #lang-toggle-wrapper span {
        transition: color 0.3s ease, text-shadow 0.3s ease;
        cursor: pointer;
    }

    #lang-toggle-wrapper span.active {
        color: var(--accent-color, #990000);
        text-shadow: 0 0 8px var(--accent-shadow, rgba(153, 0, 0, 0.4));
    }
    
    .lang-switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
    }

    .lang-switch input { 
        opacity: 0;
        width: 0;
        height: 0;
    }

    .lang-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: transparent;
        transition: .4s;
        border-radius: 18px;
        border: 1.5px solid #888;
    }

    .lang-slider:before {
        position: absolute;
        content: "";
        height: 10px;
        width: 10px;
        left: 3px;
        top: 50%;
        transform: translateY(-50%);
        background-color: #888;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .lang-slider {
        border-color: var(--accent-color, #990000);
    }

    input:checked + .lang-slider:before {
        transform: translate(15px, -50%);
        background-color: var(--accent-color, #990000);
        box-shadow: 0 0 5px var(--accent-color, #990000);
    }

    @media (max-width: 768px) {
        #lang-toggle-wrapper {

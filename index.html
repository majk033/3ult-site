    <style>
        /* --- ZMIENNE RESPONSYWNE --- */
        :root {
            --light-size: 400px;
            --light-offset: -200px;
            --blur-max: 30px;
            --beam-C-Y: 0vh;  
            --beam-L-X: -32vw; --beam-L-Y: 0vh;
            --beam-R-X: 32vw;  --beam-R-Y: 0vh;
        }

        html {
            background-color: #000000; 
            width: 100%;
            height: 100%;
            height: -webkit-fill-available; 
            margin: 0;
            padding: 0;
            overflow: hidden;
            transition: background-color 0.4s ease; 
        }

        body {
            background-color: #000000;
            color: #000000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available; 
            margin: 0;
            padding: 0;
            overflow: hidden; 
            overscroll-behavior: none; 
            transition: background-color 0.4s ease;
        }

        /* SZTUCZNE KREMOWE TŁO DLA EFEKTU ŚWIATŁA */
        .cream-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #faf0e6;
            z-index: 0; 
            pointer-events: none;
        }

        .paint-drips-container {
            position: fixed;
            inset: 0;
            z-index: 1; 
            pointer-events: none; 
        }

        .drip-group { position: absolute; width: 0; height: 0; }

        .drip {
            position: absolute;
            background-color: #990000;
            border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%;
            opacity: 0;
            transform-origin: center;
            animation: liquidSplat 5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes liquidSplat {
            0%   { transform: scale(1.5) translateY(-15px); opacity: 0; }
            5%   { transform: scale(1.1) translateY(0); opacity: 1; } 
            10%  { transform: scale(1) translateY(0); opacity: 1; }   
            70%  { transform: scale(1) translateY(0); opacity: 1; }   
            100% { transform: scale(0.9) translateY(0); opacity: 0; } 
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            transform: translateY(-8vh);
            z-index: 50; 
        }

        .gothic-text { font-family: 'UnifrakturCook', cursive; font-weight: 700; }
        
        img {
            max-width: 300px; width: 70%; height: auto; margin-bottom: 1vh; min-height: 80px; 
        }

        .dev-phase-note {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 5vh;
            text-transform: lowercase;
            visibility: hidden; 
            opacity: 0;
            pointer-events: none;
        }

        .coming-soon-container {
            color: #990000; font-size: 32px; letter-spacing: 4px; text-transform: lowercase; 
            display: flex; justify-content: center; gap: 15px; margin-bottom: 1vh;
            white-space: nowrap; 
        }

        .part-of-it {
            color: #000000; font-size: 26px; letter-spacing: 2px; text-transform: lowercase;
            text-align: center; margin-bottom: 8vh; 
            white-space: nowrap; 
        }

        .countdown {
            display: flex; gap: 20px; color: #000000; min-height: 60px; 
        }

        .countdown div {
            display: flex; flex-direction: column; align-items: center; width: 65px; 
        }

        .countdown-number {
            font-family: 'UnifrakturCook', cursive; font-weight: 700; font-size: 36px;
            font-variant-numeric: tabular-nums; 
        }

        .countdown-label {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 10px;
            letter-spacing: 2px; text-transform: uppercase; color: #666; margin-top: 5px;
        }

        .next-vessel-link {
            display: inline-block;
            background-color: transparent; 
            color: #000000; 
            font-family: 'UnifrakturCook', cursive;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 3px;
            text-transform: lowercase;
            text-decoration: underline;
            text-decoration-thickness: 2px;
            text-underline-offset: 8px;
            margin-top: 7vh; 
            transition: color 0.4s ease-in-out, text-shadow 0.4s ease-in-out, text-decoration-color 0.4s ease-in-out; 
            position: relative;
            z-index: 105; 
        }

        .next-vessel-link:hover, .next-vessel-link.active-shadow {
            color: #990000; 
            text-decoration-color: #990000; 
            text-shadow: 0 0 15px rgba(153, 0, 0, 0.5); 
        }

        /* --- NOWY PRZYCISK: PREVIOUS VESSEL --- */
        .prev-vessel-link {
            display: inline-block;
            background-color: transparent; 
            color: #666666; /* Szary, mniej zauważalny kolor */
            font-family: 'UnifrakturCook', cursive;
            font-weight: normal;
            font-size: 14px; /* Zdecydowanie mniejsza czcionka */
            letter-spacing: 2px;
            text-transform: lowercase;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 4px;
            margin-top: 2vh; /* Niewielki odstęp od głównego linku */
            transition: color 0.4s ease-in-out, text-shadow 0.4s ease-in-out, text-decoration-color 0.4s ease-in-out; 
            position: relative;
            z-index: 105; 
        }

        .prev-vessel-link:hover, .prev-vessel-link.active-shadow {
            color: #990000; 
            text-decoration-color: #990000; 
            text-shadow: 0 0 10px rgba(153, 0, 0, 0.4); 
        }

        .footer {
            position: absolute; 
            bottom: 20px; 
            font-size: 11px; 
            color: #aaa; 
            letter-spacing: 3px; 
            z-index: 10;
            transition: bottom 0.3s ease;
        }

        .subtle-link {
            position: fixed;
            bottom: 20px;
            z-index: 50; 
            color: #888; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-decoration: none;
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }

        .link-left { left: 5vw; }
        .link-right { right: 5vw; }

        .subtle-link:hover {
            color: #990000; 
            text-shadow: 0 0 8px rgba(153, 0, 0, 0.4);
        }

        /* --- BAZOWA MASKA ŚWIATŁA (STARTUJE ZGASZONA, BEZ ANIMACJI) --- */
        .spotlight-wrapper {
            position: fixed; 
            top: -20vh; bottom: -20vh; left: -20vw; right: -20vw; 
            z-index: 100; pointer-events: none; 
            mix-blend-mode: multiply; 
            opacity: 1; /* Ciemność startowa */
        }
        .lights-container {
            width: 100%; height: 100%; background-color: #000000; 
        }
        .light {
            position: absolute; top: 50%; left: 50%; width: var(--light-size); height: var(--light-size);
            margin-top: var(--light-offset); margin-left: var(--light-offset);
            border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; 
            background: radial-gradient(circle at center, rgba(255,255,255,1) 0%, rgba(255,255,255,1) 45%, rgba(0,0,0,1) 65%);
            mix-blend-mode: screen; 
            opacity: 0; /* Światła startowo niewidoczne */
        }

        /* --- AKTYWACJA ANIMACJI Z GWARANCJĄ STARTU OD 0ms --- */
        body.anim-ready .spotlight-wrapper { animation: removeDarkness 2s both; }
        body.anim-ready .lights-container { animation: lightsFlicker 2s both; }
        body.anim-ready .light { animation: shapeWobble 1s infinite linear alternate-reverse both; }
        body.anim-ready .center-beam { animation: beamCenter 2s ease-in-out both, diffuseLight 2s ease-in-out both; }
        body.anim-ready .left-beam { animation: beamLeft 2s ease-in-out both, diffuseLight 2s ease-in-out both; }
        body.anim-ready .right-beam { animation: beamRight 2s ease-in-out both, diffuseLight 2s ease-in-out both; }
        
        @keyframes shapeWobble { to { border-radius: 60% 40% 30% 70% / 60% 50% 70% 30%; } }

        @keyframes beamCenter {
            0%, 10% { transform: translate(0, 0); opacity: 0; } 
            15%, 25% { transform: translate(0, 0); opacity: 1; }
            40%, 100% { transform: translate(0, var(--beam-C-Y)); opacity: 1; }
        }
        @keyframes beamLeft {
            0%, 25% { transform: translate(0, 0); opacity: 0; } 
            26% { transform: translate(0, 0); opacity: 1; } 
            40%, 100% { transform: translate(var(--beam-L-X), var(--beam-L-Y)); opacity: 1;} 
        }
        @keyframes beamRight {
            0%, 25% { transform: translate(0, 0); opacity: 0; } 
            26% { transform: translate(0, 0); opacity: 1; } 
            40%, 100% { transform: translate(var(--beam-R-X), var(--beam-R-Y)); opacity: 1;}  
        }
        
        @keyframes diffuseLight { 
            0%, 50% { filter: blur(2px); } 
            100% { filter: blur(var(--blur-max)); } 
        }
        
        @keyframes lightsFlicker {
            0%, 65% { opacity: 1; } 
            66%, 70% { opacity: 0.1; } 
            71%, 75% { opacity: 1; } 
            76%, 80% { opacity: 0.1; } 
            81%, 85% { opacity: 1; } 
            86%, 90% { opacity: 0.1; } 
            91%, 100% { opacity: 1; }
        }
        
        @keyframes removeDarkness { 
            0%, 92% { opacity: 1; } 
            100% { opacity: 0; visibility: hidden; } 
        }

        /* --- MEDIA QUERIES (MOBILE) --- */
        @media (max-width: 768px) {
            :root {
                --light-size: 260px; 
                --light-offset: -130px;
                --blur-max: 20px;
                --beam-C-Y: 0vh;  
                --beam-L-X: 0vw;   --beam-L-Y: -35vh;
                --beam-R-X: 0vw;   --beam-R-Y: 35vh;  
            }

            .coming-soon-container {
                font-size: 6.5vw; 
                letter-spacing: 1px; 
            }

            .part-of-it {
                font-size: 5vw; 
            }

            .footer {
                display: none; 
            }
            
            .subtle-link {
                bottom: 15px; 
                font-size: 10px;
                letter-spacing: 1px;
            }
            .link-left { left: 5vw; }
            .link-right { right: 5vw; }
        }
    </style>
</head>

    <script>
        const countDownDate = new Date("July 15, 2026 18:00:00").getTime();
        const dripsContainer = document.getElementById("paint-drips-container");
        let intervalId;

        function createDripGroup() {
            const group = document.createElement("div");
            group.className = "drip-group";
            group.style.left = `${10 + Math.random() * 80}vw`;
            group.style.top = `${10 + Math.random() * 80}vh`;
            group.style.transform = `rotate(${Math.random() * 360}deg)`;

            const uniformSize = 10 + Math.random() * 8; 
            const drops = [
                { dx: 0, dy: 0, delay: 0 }, 
                { dx: -10 - Math.random() * 5, dy: 8 + Math.random() * 5, delay: 0.15 + Math.random() * 0.3 }, 
                { dx: 12 + Math.random() * 5, dy: -5 - Math.random() * 5, delay: 0.3 + Math.random() * 0.4 }   
            ];

            drops.forEach(drop => {
                const drip = document.createElement("div");
                drip.className = "drip";
                drip.style.left = `${drop.dx}px`;
                drip.style.top = `${drop.dy}px`;
                drip.style.width = `${uniformSize}px`;
                drip.style.height = `${uniformSize}px`;
                drip.style.animationDelay = `${drop.delay}s`; 
                group.appendChild(drip);
            });

            dripsContainer.appendChild(group);
            setTimeout(() => { if (group.parentNode) group.parentNode.removeChild(group); }, 6000);
        }

        let continueSpawning = true;
        function spawnLoop() {
            if (!continueSpawning) return; 
            createDripGroup();
            setTimeout(spawnLoop, (3 + Math.random() * 2) * 1000);
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = countDownDate - now;

            const formatTime = (time) => time < 10 ? "0" + time : time;
            
            document.getElementById("countdown").innerHTML = 
                "<div><span class='countdown-number'>" + formatTime(Math.floor(distance / (1000 * 60 * 60 * 24))) + "</span><span class='countdown-label'>days</span></div>" + 
                "<div><span class='countdown-number'>" + formatTime(Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))) + "</span><span class='countdown-label'>hours</span></div>" + 
                "<div><span class='countdown-number'>" + formatTime(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60))) + "</span><span class='countdown-label'>mins</span></div>" + 
                "<div><span class='countdown-number'>" + formatTime(Math.floor((distance % (1000 * 60)) / 1000)) + "</span><span class='countdown-label'>secs</span></div>";

            if (distance < 0) {
                // Odliczanie już minęło, więc ukrywamy sam licznik cyfrowy
                document.getElementById("countdown").style.visibility = "hidden";

                // Tworzymy klon napisu na środek (wykonuje się to tylko raz)
                if (!document.getElementById('centered-clone')) {
                    const originalContent = document.getElementById('content-to-center');
                    
                    const clone = originalContent.cloneNode(true);
                    clone.id = 'centered-clone';
                    clone.style.position = 'fixed';
                    clone.style.top = '50%';
                    clone.style.left = '50%';
                    clone.style.transform = 'translate(-50%, -50%)';
                    
                    clone.style.zIndex = '50'; 
                    
                    const clonePartOfIt = clone.querySelector('.part-of-it');
                    if (clonePartOfIt) {
                        clonePartOfIt.style.marginBottom = '0';
                        clonePartOfIt.innerHTML = "be part of it";
                    }

                    document.body.appendChild(clone);
                    originalContent.style.visibility = 'hidden';
                }

                // Chwytamy wyśrodkowany element
                const cloneComingSoon = document.getElementById('centered-clone').querySelector('.coming-soon-container');

                // Zmiana napisu po zakończeniu odliczania
                if (cloneComingSoon) {
                    cloneComingSoon.innerHTML = "<span>VESSEL 1 IS LIVE!</span>";
                    cloneComingSoon.style.textTransform = "uppercase";
                }
                
                // Koniec odliczania, zatrzymujemy interwał
                clearInterval(intervalId);
            }
        }

        const nextVesselLink = document.querySelector('.next-vessel-link');
        nextVesselLink.addEventListener('click', function(e) {
            if (window.innerWidth <= 768 || 'ontouchstart' in window) {
                e.preventDefault(); 
                this.classList.add('active-shadow'); 
                
                setTimeout(() => {
                    window.location.href = this.href;
                }, 800);
            }
        });

        // Obsługa urządzeń mobilnych i dotykowych dla nowego linku
        const prevVesselLink = document.querySelector('.prev-vessel-link');
        if (prevVesselLink) {
            prevVesselLink.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 || 'ontouchstart' in window) {
                    e.preventDefault(); 
                    this.classList.add('active-shadow'); 
                    
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 800);
                }
            });
        }

        // 1. Zdarzenia natychmiastowe (odliczanie ładuje się od razu)
        window.addEventListener('DOMContentLoaded', () => {
            updateCountdown(); 
            intervalId = setInterval(updateCountdown, 1000);
        });

        // 2. Zdarzenie 'load' - czeka aż pobierze się wszystko w 100% (fonty, obrazki itp.)
        window.addEventListener('load', () => {
            const metaTheme = document.getElementById('theme-color-meta');

            if (window.location.search.includes('skipAnim=true')) {
                const spotlight = document.querySelector('.spotlight-wrapper');
                if (spotlight) spotlight.style.display = 'none';
                
                if(metaTheme) metaTheme.setAttribute('content', '#faf0e6');
                document.documentElement.style.backgroundColor = '#faf0e6';
                document.body.style.backgroundColor = '#faf0e6';
                
                spawnLoop();
            } else {
                // Dodajemy klasę, co "budzi" animacje z uśpienia dokładnie w tym momencie
                requestAnimationFrame(() => {
                    document.body.classList.add('anim-ready');
                    spawnLoop(); 
                    
                    // Odliczamy 1.84s od tego momentu, by zmienić kolory pasków
                    setTimeout(() => {
                        if(metaTheme) metaTheme.setAttribute('content', '#faf0e6');
                        document.documentElement.style.backgroundColor = '#faf0e6';
                        document.body.style.backgroundColor = '#faf0e6';
                    }, 1840); 
                });
            }
        });
    </script>

    // 4. Silnik bezinwazyjnej zamiany (nie psuje żadnych Twoich div'ów i tagów span)
    function translateNode(node, lang) {
        if (node.nodeType === 3) {
            let text = node.nodeValue.trim();
            if (!text) return;
            
            let entry = dict.find(d => d.en === text || d.pl === text);
            if (entry) {
                node.nodeValue = node.nodeValue.replace(text, lang === 'pl' ? entry.pl : entry.en);
            } else {
                // Logika dla dynamicznych rozmiarów (np. Size S / Rozmiar S)
                if (text.startsWith("Size ")) {
                    if (lang === 'pl') node.nodeValue = node.nodeValue.replace("Size ", "Rozmiar ");
                } else if (text.startsWith("Rozmiar ")) {
                    if (lang === 'en') node.nodeValue = node.nodeValue.replace("Rozmiar ", "Size ");
                }
            }
        } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
            for (let i = 0; i < node.childNodes.length; i++) {
                translateNode(node.childNodes[i], lang);
            }
        }
    }

    // 5. Rozprowadzanie nowego języka po całej stronie
    function applyLanguage(lang) {
        if (lang === 'pl') {
            checkbox.checked = true;
            enLabel.classList.remove('active');
            plLabel.classList.add('active');
        } else {
            checkbox.checked = false;
            plLabel.classList.remove('active');
            enLabel.classList.add('active');
        }
        
        translateNode(document.body, lang);
        
        // Aktualizacja buttonów rozwijających zawartość (odkryte / zakryte opcje zależące od stanu w CSS)
        const descBtn = document.getElementById('toggle-description');
        const sizechartBtn = document.getElementById('toggle-sizechart');
        const availabilityBtn = document.getElementById('toggle-availability');
        
        if (descBtn) {
            const descWrapper = document.getElementById('desc-wrapper');
            if (descWrapper && descWrapper.classList.contains('active')) {
                descBtn.textContent = lang === 'pl' ? 'ukryj opis' : 'hide description';
            } else {
                descBtn.textContent = lang === 'pl' ? 'pokaż opis' : 'show description';
            }
        }
        
        if (sizechartBtn) {
            const sizeWrapper = document.getElementById('sizechart-wrapper');
            if (sizeWrapper && sizeWrapper.classList.contains('active')) {
                sizechartBtn.textContent = lang === 'pl' ? 'ukryj tabelę rozmiarów' : 'hide sizechart';
            } else {
                sizechartBtn.textContent = lang === 'pl' ? 'pokaż tabelę rozmiarów' : 'show sizechart';
            }
        }
        
        if (availabilityBtn) {
            const avWrapper = document.getElementById('availability-wrapper');
            if (avWrapper && avWrapper.classList.contains('active')) {
                availabilityBtn.textContent = lang === 'pl' ? 'ukryj dostępność rozmiarów' : 'hide size availability';
            } else {
                availabilityBtn.textContent = lang === 'pl' ? 'Kup / sprawdź dostępność rozmiarów' : 'Buy / check size availability';
            }
        }
    }

    // 6. Nasłuchiwanie manualnego kliknięcia na tekst
    checkbox.addEventListener('change', (e) => {
        const lang = e.target.checked ? 'pl' : 'en';
        localStorage.setItem('3ult_lang', lang);
        applyLanguage(lang);
    });

    enLabel.addEventListener('click', () => { checkbox.checked = false; checkbox.dispatchEvent(new Event('change')); });
    plLabel.addEventListener('click', () => { checkbox.checked = true; checkbox.dispatchEvent(new Event('change')); });

    // 7. Ładowanie uprzednio wybranego języka po przejściu z innej podstrony
    const savedLang = localStorage.getItem('3ult_lang') || 'en';
    setTimeout(() => { applyLanguage(savedLang); }, 50);

    // 8. Obserwator do tłumaczenia Twoich zmieniających się elementów co 1 sekundę (odliczanie, pasek inventory)
    const observer = new MutationObserver((mutations) => {
        const currentLang = checkbox.checked ? 'pl' : 'en';
        if (currentLang === 'en') return; 
        
        mutations.forEach(mutation => {
            if (mutation.addedNodes.length) {
                mutation.addedNodes.forEach(node => {
                    if (node.nodeType === 1 && node.id !== 'lang-toggle-wrapper') {
                       translateNode(node, currentLang);
                    }
                });
            }
        });
    });
    observer.observe(document.body, { childList: true, subtree: true });

})();

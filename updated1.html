<!DOCTYPE html>
<html lang="pl">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DMF60PRB1Y"></script>
<script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3ULT // PRODUCTS COLLECTION</title>
    
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- DYNAMICZNE ZMIENNE KOLORYSTYCZNE --- */
        :root {
            --accent-color: #990000;
            --accent-shadow: rgba(153, 0, 0, 0.4);
        }

        /* --- BAZA STRONY --- */
        body {
            background-color: #faf0e6; color: #000000; margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; font-family: 'Segoe UI', sans-serif;
            transition: background-color 0.8s ease;
        }

        /* Płynne przenikanie logo */
        .top-logo { position: absolute; top: 5vh; width: 120px; height: auto; z-index: 100; cursor: pointer; transition: opacity 0.2s ease, filter 0.5s ease; }
        .top-logo:hover { filter: drop-shadow(0 0 8px var(--accent-shadow)); }

        /* --- GLOBAL SLIDER --- */
        #slider-main {
            position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .product-slide {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; pointer-events: none; z-index: 1;
            transform: translateX(10vw); transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .product-slide.active {
            opacity: 1; visibility: visible; pointer-events: auto; z-index: 10; transform: translateX(0);
        }

        .product-slide.prev-slide {
            transform: translateX(-10vw);
        }

        /* --- CENTROWANIE ELEMENTÓW NA STRONIE GŁÓWNEJ --- */
        .main-container { display: flex; align-items: center; justify-content: center; width: 100vw; height: 100vh; }
        .product-side { display: flex; justify-content: center; align-items: center; z-index: 30; }
        
        .product-container { position: relative; transition: transform 0.6s ease; transform: translateY(-5vh); outline: none; overflow: visible; border-radius: 2px; cursor: pointer; -webkit-tap-highlight-color: transparent;}
        .product-container:hover { transform: translateY(-5vh) scale(1.02); }
        .product-container:focus { outline: none; }

        .media-mask {
            position: relative; width: 35vw; max-width: 450px; min-width: 280px;
            aspect-ratio: 1 / 1; overflow: hidden; border-radius: 2px; -webkit-mask-image: -webkit-radial-gradient(white, black); outline: none;
        }

        .product-mockup { width: 100%; height: 100%; object-fit: cover; display: block; border: none; outline: none; background-color: transparent; transform: scale(1.04); transform-origin: center; transition: opacity 0.5s ease, filter 0.8s ease; }

        /* --- GLOBALNE STRZAŁKI NAWIGACJI --- */
        .global-nav {
            position: fixed; top: 50%; transform: translateY(-50%); font-family: 'Segoe UI', sans-serif; font-size: 28px; font-weight: 900;
            color: var(--accent-color); background: transparent; border: none; cursor: pointer; z-index: 999; padding: 20px;
            transition: color 0.4s ease, text-shadow 0.4s ease, opacity 0.4s ease, transform 0.2s ease;
            text-shadow: 0px 1px 3px rgba(0, 0, 0, 0.4);
        }
        .global-nav:hover { text-shadow: 0 0 12px var(--accent-shadow); filter: brightness(1.2); transform: translateY(-50%) scale(1.1); }
        
        /* Strzałki blisko wideo */
        #global-prev { left: calc(50vw - 320px); }
        #global-next { right: calc(50vw - 320px); }

        /* --- KURTYNA PRZEJŚCIA --- */
        .transition-overlay { position: absolute; inset: 0; background-color: #faf0e6; z-index: 50; display: flex; justify-content: center; align-items: center; gap: 15px; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; border-radius: 2px; }
        body.is-transitioning .transition-overlay { opacity: 1; visibility: visible; }

        .trans-dot { width: 14px; height: 14px; background-color: var(--accent-color); border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; box-shadow: inset 0 0 3px rgba(0,0,0,0.4); opacity: 0; transform: scale(0.5); }
        body.is-transitioning .trans-dot { animation: dotPulse 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        body.is-transitioning .trans-dot:nth-child(1) { animation-delay: 0.1s; }
        body.is-transitioning .trans-dot:nth-child(2) { animation-delay: 0.25s; }
        body.is-transitioning .trans-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotPulse { 0% { opacity: 0; transform: scale(0.5) translateY(10px); } 50% { opacity: 1; transform: scale(1.3) translateY(0); box-shadow: 0 0 15px var(--accent-shadow); } 100% { opacity: 1; transform: scale(1) translateY(0); } }

        /* --- SOLD OUT SYSTEM --- */
        .is-sold-out .product-mockup { filter: none; }

        .sold-out-text {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-family: 'UnifrakturCook', cursive; font-size: 42px; color: var(--accent-color);
            letter-spacing: 6px; text-transform: uppercase; 
            text-shadow: 0px 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,0.8), 0 0 30px var(--accent-shadow);
            z-index: 60; pointer-events: none; text-align: center; white-space: nowrap;
            opacity: 0; transition: opacity 0.6s ease 0.3s;
        }
        .is-sold-out .sold-out-text { opacity: 1; }

        /* --- RĘCE --- */
        .hands-container { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
        .hand { position: absolute; width: 42vw; max-width: 480px; min-width: 260px; height: auto; filter: grayscale(100%) contrast(1.5) brightness(0.7); transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease; bottom: -5vh; opacity: 0.9; }
        .hand-left { left: 50%; transform: translateX(-85%) translateY(12vh); }
        .hand-center { left: 50%; transform: translateX(-50%) translateY(14vh) scale(1.05); }
        .hand-right { left: 50%; transform: translateX(-15%) translateY(12vh); }
        body.reaching .hand { opacity: 1; }
        body.reaching .hand-left { transform: translateX(-85%) translateY(7vh); }
        body.reaching .hand-center { transform: translateX(-50%) translateY(9vh) scale(1.1); }
        body.reaching .hand-right { transform: translateX(-15%) translateY(7vh); }

        .click-hint { position: absolute; top: 100%; left: 0; margin-top: 15px; text-align: center; width: 100%; display: block; font-family: 'Segoe UI', sans-serif; font-size: 11px; color: #888; letter-spacing: 2px; text-transform: lowercase; transition: color 0.3s ease, text-shadow 0.3s ease, opacity 0.4s ease; pointer-events: none; }
        .product-container:hover .click-hint { color: var(--accent-color); text-shadow: 0 0 8px var(--accent-shadow); }

        /* --- DOLNE LINKI --- */
        .subtle-link { position: fixed; bottom: 3vh; z-index: 105; color: #888; font-family: 'Segoe UI', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: lowercase; text-decoration: none; transition: color 0.4s ease, text-shadow 0.4s ease; }
        .link-left { left: 5vw; }
        .link-right { right: 5vw; }
        .subtle-link:hover { color: var(--accent-color); text-shadow: 0 0 8px var(--accent-shadow); }

        /* --- RESPONSIVE DESKTOP --- */
        @media screen and (max-width: 1440px) and (min-width: 769px), screen and (max-height: 900px) and (min-width: 769px) {
            body { zoom: 0.85; }
            .product-container { transform: translateY(6vh); }
            .product-container:hover { transform: translateY(6vh) scale(1.02); }
            .hand-left { transform: translateX(-85%) translateY(18vh); }
            .hand-center { transform: translateX(-50%) translateY(20vh) scale(1.05); }
            .hand-right { transform: translateX(-15%) translateY(18vh); }
        }

        /* --- RESPONSIVE MOBILE --- */
        @media (max-width: 768px) {
            .media-mask { width: 80vw; aspect-ratio: 1 / 1; }
            .product-container { transform: translateY(-3vh); transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
            .product-container:hover { transform: translateY(-3vh); }

            .global-nav { font-size: 18px; padding: 10px; } 
            #global-prev { left: 1vw; }
            #global-next { right: 1vw; }
            
            .subtle-link { display: none; }

            .hand { width: 55vw; bottom: 0; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease, visibility 0.5s; }
            .hand-left { transform: translateX(-80%) translateY(3vh); }
            .hand-center { transform: translateX(-50%) translateY(5vh) scale(1.05); }
            .hand-right { transform: translateX(-20%) translateY(3vh); }
            
            body.reaching .hand-left { transform: translateX(-80%) translateY(0vh); }
            body.reaching .hand-center { transform: translateX(-50%) translateY(2vh) scale(1.1); }
            body.reaching .hand-right { transform: translateX(-20%) translateY(0vh); }
        }
    </style>
</head>
<body>

    <img src="logo1.png" alt="3ULT LOGO" class="top-logo" id="main-logo">

    <button id="global-prev" class="global-nav">[ &lt; ]</button>
    <button id="global-next" class="global-nav">[ &gt; ]</button>

    <div id="slider-main">
        
        <!-- ================= PRODUCT 1 (ODNOŚNIK DO DETAILS1.HTML) ================= -->
        <div class="product-slide active" data-accent="#990000" data-shadow="rgba(153, 0, 0, 0.4)" data-logo="logo1.png" data-drop="2026-07-15T18:00:00" id="product-1">
            <div class="main-container">
                <div class="product-side">
                    <div class="product-container product-trigger">
                        <div class="media-mask">
                            <div class="sold-out-text">SOLD OUT</div>
                            <video src="3vid.mp4" class="product-mockup" autoplay loop muted playsinline></video>
                            <div class="transition-overlay">
                                <div class="trans-dot"></div><div class="trans-dot"></div><div class="trans-dot"></div>
                            </div>
                        </div>
                        <div class="click-hint">[ click to explore & buy ]</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= PRODUCT 2 (ODNOŚNIK DO DETAILS2.HTML) ================= -->
        <div class="product-slide" data-accent="#0033a0" data-shadow="rgba(0, 51, 160, 0.4)" data-logo="glasslg.png" data-drop="2026-06-19T18:00:00" id="product-2">
            <div class="main-container">
                <div class="product-side">
                    <div class="product-container product-trigger">
                        <div class="media-mask">
                            <div class="sold-out-text">SOLD OUT</div>
                            <video src="0613.mp4" class="product-mockup" autoplay loop muted playsinline></video>
                            <div class="transition-overlay">
                                <div class="trans-dot"></div><div class="trans-dot"></div><div class="trans-dot"></div>
                            </div>
                        </div>
                        <div class="click-hint">[ click to explore & buy ]</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <a href="about.html" class="subtle-link link-left">about...</a>
    <a href="terms.html" class="subtle-link link-right">terms & privacy</a>

    <div class="hands-container">
        <!-- Zwróć uwagę: wszystkie img mają teraz poprawnie zdefiniowaną klasę "hand" -->
        <img src="hand-left.png" alt="hand" class="hand hand-left">
        <img src="hand-center.png" alt="hand" class="hand hand-center">
        <img src="hand-right.png" alt="hand" class="hand hand-right">
    </div>

    <!-- LOGIKA STRONY -->
    <script>
        const inventories = {
            'product-1': [
                { size: "S",   total: 4, current: 0 },
                { size: "M",   total: 6, current: 0 },
                { size: "L",   total: 6, current: 0 },
                { size: "XL",  total: 4, current: 0 },
                { size: "XXL", total: 100, current: 0 }
            ],
            'product-2': [
                { size: "XS",  total: 2, current: 0 },
                { size: "S",   total: 4, current: 0 },
                { size: "M",   total: 8, current: 0 },
                { size: "L",   total: 7, current: 0 },
                { size: "XL",  total: 3, current: 0 },
                { size: "XXL", total: 1, current: 0 }
            ]
        };

        const slidesData = document.querySelectorAll('.product-slide');
        let currentGlobalSlide = 0;

        function updateGlobalColors() {
            const active = slidesData[currentGlobalSlide];
            document.documentElement.style.setProperty('--accent-color', active.dataset.accent);
            document.documentElement.style.setProperty('--accent-shadow', active.dataset.shadow);
            
            const logo = document.getElementById('main-logo');
            const newLogoSrc = active.dataset.logo;
            
            if (!logo.src.includes(newLogoSrc)) {
                logo.style.opacity = '0';
                setTimeout(() => {
                    logo.src = newLogoSrc;
                    logo.style.opacity = '1';
                }, 200); 
            }
        }

        function switchSlide(direction) {
            if (document.body.classList.contains('is-transitioning')) return;
            
            slidesData[currentGlobalSlide].classList.remove('active');
            slidesData[currentGlobalSlide].classList.add(direction === 'next' ? 'prev-slide' : 'next-slide');
            
            currentGlobalSlide = (currentGlobalSlide + (direction === 'next' ? 1 : -1) + slidesData.length) % slidesData.length;
            
            slidesData.forEach(s => { s.classList.remove('prev-slide', 'next-slide'); });
            slidesData[currentGlobalSlide].classList.add('active');
            updateGlobalColors();
        }

        document.getElementById('global-next').addEventListener('click', () => switchSlide('next'));
        document.getElementById('global-prev').addEventListener('click', () => switchSlide('prev'));

        let touchstartX = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; });
        document.addEventListener('touchend', e => {
            let touchendX = e.changedTouches[0].screenX;
            if (touchendX < touchstartX - 50) switchSlide('next');
            if (touchendX > touchstartX + 50) switchSlide('prev');
        });

        function checkSoldOutStatus() {
            const now = new Date().getTime();
            slidesData.forEach(slide => {
                const id = slide.id;
                const dropDate = new Date(slide.dataset.drop).getTime();
                const isDropActive = now >= dropDate;
                const inventory = inventories[id];
                
                let totalCurrentStock = 0;
                inventory.forEach(item => { totalCurrentStock += item.current; });

                const mediaMask = slide.querySelector('.media-mask');
                if (totalCurrentStock === 0 && isDropActive) {
                    mediaMask.classList.add('is-sold-out');
                } else {
                    mediaMask.classList.remove('is-sold-out');
                }
            });
        }
        setInterval(checkSoldOutStatus, 1000);
        checkSoldOutStatus();
        updateGlobalColors();

        // LOGIKA PRZEKIEROWAŃ DO PODSTRON
        slidesData.forEach(slide => {
            const trigger = slide.querySelector('.product-trigger');
            
            trigger.addEventListener('click', (e) => {
                if(e.target.tagName.toLowerCase() === 'button') return;
                
                if (window.innerWidth <= 768) document.body.classList.add('reaching');
                document.body.classList.add('is-transitioning');
                
                setTimeout(() => {
                    if (slide.id === 'product-1') {
                        window.location.href = 'details1.html';
                    } else if (slide.id === 'product-2') {
                        window.location.href = 'details2.html';
                    }
                }, 600); 
            });

            trigger.addEventListener('mouseenter', () => { if (window.innerWidth > 768) document.body.classList.add('reaching'); });
            trigger.addEventListener('mouseleave', () => { if (window.innerWidth > 768) document.body.classList.remove('reaching'); });
        });

        document.querySelectorAll('.subtle-link').forEach(link => {
            link.addEventListener('click', function(e) {
                if (window.innerWidth <= 768 || 'ontouchstart' in window) {
                    e.preventDefault();
                    this.classList.add('active-shadow');
                    setTimeout(() => { window.location.href = this.href; }, 400); 
                }
            });
        });
        
        document.getElementById('main-logo').addEventListener('click', function(e) {
             window.location.href = 'index.html?skipAnim=true';
        });
    </script>
    
    <!-- SYSTEM TŁUMACZEŃ WIDGET -->
    <style>
        #lang-toggle-wrapper { position: fixed; top: 5vh; right: 5vw; z-index: 9999; display: flex; align-items: center; gap: 8px; font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: lowercase; color: #888; user-select: none; }
        #lang-toggle-wrapper span { transition: color 0.3s ease, text-shadow 0.3s ease; cursor: pointer; }
        #lang-toggle-wrapper span.active { color: var(--accent-color); text-shadow: 0 0 8px var(--accent-shadow); }
        .lang-switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .lang-switch input { opacity: 0; width: 0; height: 0; }
        .lang-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: transparent; transition: .4s; border-radius: 18px; border: 1.5px solid #888; }
        .lang-slider:before { position: absolute; content: ""; height: 10px; width: 10px; left: 3px; top: 50%; transform: translateY(-50%); background-color: #888; transition: .4s; border-radius: 50%; }
        input:checked + .lang-slider { border-color: var(--accent-color); }
        input:checked + .lang-slider:before { transform: translate(15px, -50%); background-color: var(--accent-color); box-shadow: 0 0 5px var(--accent-color); }
        @media (max-width: 768px) { #lang-toggle-wrapper { top: 3.5vh; font-size: 10px; gap: 6px; } }
    </style>
    <script>
    (function() {
        const toggleHTML = `<div id="lang-toggle-wrapper"><span id="lang-en" class="active">en</span><label class="lang-switch"><input type="checkbox" id="lang-checkbox"><span class="lang-slider"></span></label><span id="lang-pl">pl</span></div>`;
        document.body.insertAdjacentHTML('beforeend', toggleHTML);
        const checkbox = document.getElementById('lang-checkbox'), enLabel = document.getElementById('lang-en'), plLabel = document.getElementById('lang-pl');
        const dict = [ { en: "[ click to explore & buy ]", pl: "[ kliknij by odkryć i kupić ]" }, { en: "about...", pl: "o nas..." }, { en: "terms & privacy", pl: "regulamin" } ];
        function translateNode(node, lang) {
            if (node.nodeType === 3) {
                let text = node.nodeValue.trim();
                if (!text) return;
                let entry = dict.find(d => d.en === text || d.pl === text);
                if (entry) { node.nodeValue = node.nodeValue.replace(text, lang === 'pl' ? entry.pl : entry.en); } 
            } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
                for (let i = 0; i < node.childNodes.length; i++) translateNode(node.childNodes[i], lang);
            }
        }
        function applyLanguage(lang) {
            if (lang === 'pl') { checkbox.checked = true; enLabel.classList.remove('active'); plLabel.classList.add('active'); } else { checkbox.checked = false; plLabel.classList.remove('active'); enLabel.classList.add('active'); }
            translateNode(document.body, lang);
        }
        checkbox.addEventListener('change', (e) => { const lang = e.target.checked ? 'pl' : 'en'; localStorage.setItem('3ult_lang', lang); applyLanguage(lang); });
        enLabel.addEventListener('click', () => { checkbox.checked = false; checkbox.dispatchEvent(new Event('change')); });
        plLabel.addEventListener('click', () => { checkbox.checked = true; checkbox.dispatchEvent(new Event('change')); });
        setTimeout(() => { applyLanguage(localStorage.getItem('3ult_lang') || 'en'); }, 50);
        const observer = new MutationObserver((mutations) => {
            const currentLang = checkbox.checked ? 'pl' : 'en';
            if (currentLang === 'en') return; 
            mutations.forEach(mutation => { if (mutation.addedNodes.length) mutation.addedNodes.forEach(node => { if (node.nodeType === 1 && node.id !== 'lang-toggle-wrapper') translateNode(node, currentLang); }); });
        });
        observer.observe(document.body, { childList: true, subtree: true });
    })();
    </script>
</body>
</html>

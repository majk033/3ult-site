<!DOCTYPE html>
<html lang="pl">
<head>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DMF60PRB1Y"></script>
<script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ULT // Previous VESSEL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- BAZA STRONY --- */
        body {
            background-color: #faf0e6; 
            color: #000000; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
        }

        .top-logo { position: absolute; top: 5vh; width: 120px; height: auto; z-index: 100; cursor: pointer; transition: filter 0.3s ease; }
        .top-logo:hover, .top-logo.active-shadow { filter: drop-shadow(0 0 8px rgba(153, 0, 0, 0.5)); }

        .main-container { display: flex; align-items: center; justify-content: center; width: 95vw; height: 85vh; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .product-side { flex: 1; display: flex; justify-content: center; align-items: center; z-index: 30; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        .product-container {
            position: relative; cursor: pointer; transition: transform 0.6s ease; transform: translateY(-5vh); 
            -webkit-tap-highlight-color: transparent; outline: none; overflow: visible; border-radius: 2px; 
        }
        .product-container:hover { transform: translateY(-5vh) scale(1.02); }
        .product-container:focus { outline: none; }

        .media-mask {
            position: relative; width: 35vw; max-width: 450px; min-width: 280px; min-height: 350px; 
            overflow: hidden; border-radius: 2px; -webkit-mask-image: -webkit-radial-gradient(white, black); outline: none;
        }

        .product-mockup { width: 100%; height: auto; display: block; border: none; outline: none; background-color: transparent; transform: scale(1.04); transform-origin: center; transition: opacity 0.5s ease; }

        /* --- KURTYNA PRZEJŚCIA (3 KROPKI) --- */
        .transition-overlay { position: absolute; inset: 0; background-color: #faf0e6; z-index: 50; display: flex; justify-content: center; align-items: center; gap: 15px; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; border-radius: 2px; }
        body.is-transitioning .transition-overlay { opacity: 1; visibility: visible; }

        .trans-dot { width: 14px; height: 14px; background-color: #990000; border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; box-shadow: inset 0 0 3px rgba(0,0,0,0.4); opacity: 0; transform: scale(0.5); }
        body.is-transitioning .trans-dot { animation: dotPulse 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        body.is-transitioning .trans-dot:nth-child(1) { animation-delay: 0.1s; }
        body.is-transitioning .trans-dot:nth-child(2) { animation-delay: 0.25s; }
        body.is-transitioning .trans-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%   { opacity: 0; transform: scale(0.5) translateY(10px); }
            50%  { opacity: 1; transform: scale(1.3) translateY(0); box-shadow: 0 0 15px rgba(153, 0, 0, 0.6); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- RĘCE --- */
        .hands-container { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
        .hand { position: absolute; width: 42vw; max-width: 480px; min-width: 260px; height: auto; filter: grayscale(100%) contrast(1.5) brightness(0.7); transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease; bottom: -5vh; opacity: 0.9; }
        .hand-left { left: 50%; transform: translateX(-85%) translateY(12vh); }
        .hand-center { left: 50%; transform: translateX(-50%) translateY(14vh) scale(1.05); }
        .hand-right { left: 50%; transform: translateX(-15%) translateY(12vh); }
        body.reaching .hand { opacity: 1; }
        body.reaching .hand-left { transform: translateX(-85%) translateY(7vh); }
        body.reaching .hand-center { transform: translateX(-50%) translateY(9vh) scale(1.1); }
        body.reaching .hand-right { transform: translateX(-15%) translateY(7vh); }

        /* --- DOLNE LINKI --- */
        .subtle-link { position: fixed; bottom: 3vh; z-index: 105; color: #888; font-family: 'Segoe UI', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: lowercase; text-decoration: none; transition: color 0.4s ease, text-shadow 0.4s ease; }
        .link-left { left: 5vw; }
        .link-right { right: 5vw; }
        .subtle-link:hover, .subtle-link.active-shadow { color: #990000; text-shadow: 0 0 8px rgba(153, 0, 0, 0.4); }

        /* --- NAPIS POD KOSZULKĄ --- */
        .click-hint { text-align: center; font-family: 'Segoe UI', sans-serif; font-size: 11px; color: #888; letter-spacing: 2px; text-transform: lowercase; margin-top: 20px; transition: color 0.3s ease, text-shadow 0.3s ease, opacity 0.4s ease; pointer-events: none; }
        .product-container:hover .click-hint { color: #990000; text-shadow: 0 0 8px rgba(153, 0, 0, 0.4); }

        /* --- RESPONSIVE --- */
        @media screen and (max-width: 1440px) and (min-width: 769px), screen and (max-height: 900px) and (min-width: 769px) {
            body { zoom: 0.85; }
            .main-container { height: 95vh; }
            .product-container { transform: translateY(6vh); }
            .product-container:hover { transform: translateY(6vh) scale(1.02); }
            .hand-left { transform: translateX(-85%) translateY(18vh); }
            .hand-center { transform: translateX(-50%) translateY(20vh) scale(1.05); }
            .hand-right { transform: translateX(-15%) translateY(18vh); }
        }

        @media (max-width: 768px) {
            .main-container { flex-direction: column; height: auto; margin-top: 15vh; }
            .product-side { flex: none; width: 100%; }
            .media-mask { width: 70vw; min-height: 250px; }
            .product-container { transform: translateY(10vh); transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
            .product-container:hover { transform: translateY(10vh); } 
            .subtle-link { display: none; }
            .hand { width: 55vw; bottom: 0; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease, visibility 0.5s; }
            .hand-left { transform: translateX(-80%) translateY(5vh); }
            .hand-center { transform: translateX(-50%) translateY(7vh) scale(1.05); }
            .hand-right { transform: translateX(-20%) translateY(5vh); }
            body.reaching .hand-left { transform: translateX(-80%) translateY(0vh); }
            body.reaching .hand-center { transform: translateX(-50%) translateY(2vh) scale(1.1); }
            body.reaching .hand-right { transform: translateX(-20%) translateY(0vh); }
        }
    </style>
</head>
<body>

    <img src="logowektor.svg" alt="3ULT LOGO" class="top-logo" id="main-logo">

    <div class="main-container">
        <div class="product-side">
            <div class="product-container" id="product-trigger">
                
                <div class="media-mask">
                    <video src="3vid.mp4" class="product-mockup" autoplay loop muted playsinline></video>
                    
                    <div class="transition-overlay">
                        <div class="trans-dot"></div>
                        <div class="trans-dot"></div>
                        <div class="trans-dot"></div>
                    </div>
                </div>

                <div class="click-hint">[ click to explore & buy ]</div>

            </div>
        </div>
    </div>

    <a href="about.html" class="subtle-link link-left">about...</a>
    <a href="terms.html" class="subtle-link link-right">terms & privacy</a>

    <div class="hands-container">
        <img src="hand-left.png" alt="hand" class="hand hand-left">
        <img src="hand-center.png" alt="hand" class="hand hand-center">
        <img src="hand-right.png" alt="hand" class="hand hand-right">
    </div>

    <script>
        // Logika powrotu i linków
        document.getElementById('main-logo').addEventListener('click', function(e) {
            window.location.href = 'index.html?skipAnim=true';
        });

        // Przejście na podstronę ze szczegółami i kupnem
        const product = document.getElementById('product-trigger');
        
        product.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                document.body.classList.add('reaching'); 
            }
            
            // Odpalenie animacji ładowania/przejścia
            document.body.classList.add('is-transitioning');
            
            // Po 600ms przenosimy na plik details1.html
            setTimeout(() => {
                window.location.href = 'details1.html';
            }, 600); 
        });

        // Efekt sięgających rąk
        product.addEventListener('mouseenter', () => { if (window.innerWidth > 768) document.body.classList.add('reaching'); });
        product.addEventListener('mouseleave', () => { if (window.innerWidth > 768) document.body.classList.remove('reaching'); });
    </script>
</body>
</html>

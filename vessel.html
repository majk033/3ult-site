<html lang="pl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3ULT // Previous VESSEL</title>
    
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    
    <style>
        /* --- BAZA STRONY --- */
        body {
            background-color: #faf0e6; 
            color: #000000; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            font-family: 'Segoe UI', sans-serif;
        }

        .top-logo { position: absolute; top: 5vh; width: 120px; height: auto; z-index: 100; cursor: pointer; transition: filter 0.3s ease; }
        .top-logo:hover, .top-logo.active-shadow { filter: drop-shadow(0 0 8px rgba(153, 0, 0, 0.5)); }

        .main-container { display: flex; align-items: center; justify-content: center; width: 95vw; height: 85vh; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .product-side { flex: 1; display: flex; justify-content: center; align-items: center; z-index: 30; transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        .product-container {
            position: relative; cursor: pointer; transition: transform 0.6s ease; transform: translateY(-5vh); 
            -webkit-tap-highlight-color: transparent; outline: none; overflow: visible; border-radius: 2px; 
        }
        .product-container:hover { transform: translateY(-5vh) scale(1.02); }
        .product-container:focus { outline: none; }

        .media-mask {
            position: relative; width: 35vw; max-width: 450px; min-width: 280px; 
            aspect-ratio: 1 / 1; /* Gwarancja idealnego kwadratu */
            overflow: hidden; border-radius: 2px; -webkit-mask-image: -webkit-radial-gradient(white, black); outline: none;
        }

        .product-mockup { width: 100%; height: 100%; object-fit: cover; display: block; border: none; outline: none; background-color: transparent; transform: scale(1.04); transform-origin: center; transition: opacity 0.5s ease; }

        /* --- KURTYNA PRZEJŚCIA (3 KROPKI) --- */
        .transition-overlay { position: absolute; inset: 0; background-color: #faf0e6; z-index: 50; display: flex; justify-content: center; align-items: center; gap: 15px; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; border-radius: 2px; }
        body.is-transitioning .transition-overlay { opacity: 1; visibility: visible; }

        .trans-dot { width: 14px; height: 14px; background-color: #990000; border-radius: 40% 60% 70% 30% / 50% 60% 30% 70%; box-shadow: inset 0 0 3px rgba(0,0,0,0.4); opacity: 0; transform: scale(0.5); }
        body.is-transitioning .trans-dot { animation: dotPulse 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        body.is-transitioning .trans-dot:nth-child(1) { animation-delay: 0.1s; }
        body.is-transitioning .trans-dot:nth-child(2) { animation-delay: 0.25s; }
        body.is-transitioning .trans-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dotPulse {
            0%   { opacity: 0; transform: scale(0.5) translateY(10px); }
            50%  { opacity: 1; transform: scale(1.3) translateY(0); box-shadow: 0 0 15px rgba(153, 0, 0, 0.6); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* --- RĘCE --- */
        .hands-container { position: fixed; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
        .hand { position: absolute; width: 42vw; max-width: 480px; min-width: 260px; height: auto; filter: grayscale(100%) contrast(1.5) brightness(0.7); transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease; bottom: -5vh; opacity: 0.9; }
        .hand-left { left: 50%; transform: translateX(-85%) translateY(12vh); }
        .hand-center { left: 50%; transform: translateX(-50%) translateY(14vh) scale(1.05); }
        .hand-right { left: 50%; transform: translateX(-15%) translateY(12vh); }
        body.reaching .hand { opacity: 1; }
        body.reaching .hand-left { transform: translateX(-85%) translateY(7vh); }
        body.reaching .hand-center { transform: translateX(-50%) translateY(9vh) scale(1.1); }
        body.reaching .hand-right { transform: translateX(-15%) translateY(7vh); }

        /* --- DOLNE LINKI --- */
        .subtle-link { position: fixed; bottom: 3vh; z-index: 105; color: #888; font-family: 'Segoe UI', sans-serif; font-size: 11px; letter-spacing: 2px; text-transform: lowercase; text-decoration: none; transition: color 0.4s ease, text-shadow 0.4s ease; }
        .link-left { left: 5vw; }
        .link-right { right: 5vw; }
        .subtle-link:hover, .subtle-link.active-shadow { color: #990000; text-shadow: 0 0 8px rgba(153, 0, 0, 0.4); }

        /* --- NAPIS POD KOSZULKĄ --- */
        .click-hint { text-align: center; font-family: 'Segoe UI', sans-serif; font-size: 11px; color: #888; letter-spacing: 2px; text-transform: lowercase; margin-top: 20px; transition: color 0.3s ease, text-shadow 0.3s ease, opacity 0.4s ease; pointer-events: none; }
        .product-container:hover .click-hint { color: #990000; text-shadow: 0 0 8px rgba(153, 0, 0, 0.4); }

        /* --- RESPONSIVE --- */
        @media screen and (max-width: 1440px) and (min-width: 769px), screen and (max-height: 900px) and (min-width: 769px) {
            body { zoom: 0.85; }
            .main-container { height: 95vh; }
            .product-container { transform: translateY(6vh); }
            .product-container:hover { transform: translateY(6vh) scale(1.02); }
            .hand-left { transform: translateX(-85%) translateY(18vh); }
            .hand-center { transform: translateX(-50%) translateY(20vh) scale(1.05); }
            .hand-right { transform: translateX(-15%) translateY(18vh); }
        }

        @media (max-width: 768px) {
            /* Wyśrodkowanie kontenera na mobile */
            .main-container { flex-direction: column; height: 100vh; margin-top: 0; justify-content: center; }
            .product-side { flex: none; width: 100%; display: flex; justify-content: center; align-items: center; }
            .media-mask { width: 85vw; aspect-ratio: 1 / 1; }
            /* Brak zsuwania w dół, trzymamy koszulkę na środku */
            .product-container { transform: translateY(-2vh); transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
            .product-container:hover { transform: translateY(-2vh); } 
            .subtle-link { display: none; }
            
            /* Dopasowanie rąk */
            .hand { width: 65vw; bottom: 0; transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.5s ease, visibility 0.5s; }
            .hand-left { transform: translateX(-80%) translateY(5vh); }
            .hand-center { transform: translateX(-50%) translateY(7vh) scale(1.05); }
            .hand-right { transform: translateX(-20%) translateY(5vh); }
            body.reaching .hand-left { transform: translateX(-80%) translateY(0vh); }
            body.reaching .hand-center { transform: translateX(-50%) translateY(2vh) scale(1.1); }
            body.reaching .hand-right { transform: translateX(-20%) translateY(0vh); }
        }
    </style>
</head>
<body>

    <img src="logowektor.svg" alt="3ULT LOGO" class="top-logo" id="main-logo">

    <div class="main-container">
        <div class="product-side">
            <div class="product-container" id="product-trigger">
                
                <div class="media-mask">
                    <video src="3vid.mp4" class="product-mockup" autoplay loop muted playsinline></video>
                    
                    <div class="transition-overlay">
                        <div class="trans-dot"></div>
                        <div class="trans-dot"></div>
                        <div class="trans-dot"></div>
                    </div>
                </div>

                <div class="click-hint">[ click to explore & buy ]</div>

            </div>
        </div>
    </div>

    <a href="about.html" class="subtle-link link-left">about...</a>
    <a href="terms.html" class="subtle-link link-right">terms & privacy</a>

    <div class="hands-container">
        <img src="hand-left.png" alt="hand" class="hand hand-left">
        <img src="hand-center.png" alt="hand" class="hand hand-center">
        <img src="hand-right.png" alt="hand" class="hand hand-right">
    </div>

    <script>
        // Logika powrotu i linków
        document.getElementById('main-logo').addEventListener('click', function(e) {
            window.location.href = 'index.html?skipAnim=true';
        });

        // Przejście na podstronę ze szczegółami i kupnem
        const product = document.getElementById('product-trigger');
        
        product.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                document.body.classList.add('reaching'); 
            }
            
            // Odpalenie animacji ładowania/przejścia
            document.body.classList.add('is-transitioning');
            
            // Po 600ms przenosimy na plik details1.html
            setTimeout(() => {
                window.location.href = 'details1.html';
            }, 600); 
        });

        // Efekt sięgających rąk
        product.addEventListener('mouseenter', () => { if (window.innerWidth > 768) document.body.classList.add('reaching'); });
        product.addEventListener('mouseleave', () => { if (window.innerWidth > 768) document.body.classList.remove('reaching'); });
    </script>
  <style>
    /* Kontener suwaka przypięty w prawym górnym rogu */
    #lang-toggle-wrapper {
        position: fixed;
        top: 5vh;
        right: 5vw;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: lowercase;
        color: #888;
        user-select: none;
    }
    
    #lang-toggle-wrapper span {
        transition: color 0.3s ease, text-shadow 0.3s ease;
        cursor: pointer;
    }

    #lang-toggle-wrapper span.active {
        color: var(--accent-color, #990000);
        text-shadow: 0 0 8px var(--accent-shadow, rgba(153, 0, 0, 0.4));
    }
    
    /* Wygląd suwaka (switch) */
    .lang-switch {
        position: relative;
        display: inline-block;
        width: 34px;
        height: 18px;
    }

    .lang-switch input { 
        opacity: 0;
        width: 0;
        height: 0;
    }

    .lang-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: transparent;
        transition: .4s;
        border-radius: 18px;
        border: 1.5px solid #888;
    }

    .lang-slider:before {
        position: absolute;
        content: "";
        height: 10px;
        width: 10px;
        left: 3px;
        top: 50%;
        transform: translateY(-50%);
        background-color: #888;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .lang-slider {
        border-color: var(--accent-color, #990000);
    }

    input:checked + .lang-slider:before {
        transform: translate(15px, -50%);
        background-color: var(--accent-color, #990000);
        box-shadow: 0 0 5px var(--accent-color, #990000);
    }

    /* Dopasowanie mobilne */
    @media (max-width: 768px) {
        #lang-toggle-wrapper {
            top: 3.5vh; 
            right: 5vw;
            font-size: 10px;
            gap: 6px;
        }
    }
</style>

<script>
(function() {
    // 1. Wymuszenie stałego, wyłącznie czerwonego akcentu kolorystycznego
    const accentColor = '#990000';
    const accentShadow = 'rgba(153, 0, 0, 0.4)';
    
    document.documentElement.style.setProperty('--accent-color', accentColor);
    document.documentElement.style.setProperty('--accent-shadow', accentShadow);

    // 2. Dodanie widgetu na stronę
    const toggleHTML = `
        <div id="lang-toggle-wrapper">
            <span id="lang-en" class="active">en</span>
            <label class="lang-switch">
                <input type="checkbox" id="lang-checkbox">
                <span class="lang-slider"></span>
            </label>
            <span id="lang-pl">pl</span>
        </div>
    `;
    document.body.insertAdjacentHTML('beforeend', toggleHTML);

    const checkbox = document.getElementById('lang-checkbox');
    const enLabel = document.getElementById('lang-en');
    const plLabel = document.getElementById('lang-pl');

    // 3. Pełen słownik tłumaczeń wszystkich tekstów
    const dict = [
        { en: "About...", pl: "O nas..." },
        { en: "I have been working on graphics since 2018. Over the years, I have been quietly gaining experience, testing various printing houses and different materials to see what truly holds up. It was a long process of trial and error, but it allowed me to understand exactly what I want to represent.", pl: "Zajmuję się grafiką od 2018 roku. Przez te lata po cichu zdobywałem doświadczenie, testując różne drukarnie i materiały, by sprawdzić, co naprawdę się sprawdza. Był to długi proces prób i błędów, ale pozwolił mi zrozumieć, co dokładnie chcę reprezentować." },
        { en: "Now, I am taking 3ULT seriously. I am dedicating all my free time to this project because it is where I find my true fulfillment. This brand exists as a way to express myself and to draw attention to dark, detailed graphics that are the result of hours of refinement.", pl: "Teraz traktuję 3ULT poważnie. Poświęcam temu projektowi cały mój wolny czas, ponieważ to tutaj znajduję prawdziwe spełnienie. Ta marka istnieje jako sposób na wyrażenie siebie i zwrócenie uwagi na mroczne, szczegółowe grafiki, które są wynikiem godzin dopracowywania." },
        { en: "The logo—three dots placed side by side—is a symbol that has followed me throughout my life. To me, the number three represents balance. This detail is integrated into everything I do: from the hand-sewn tags on every garment to the subtle elements woven into the graphics themselves.", pl: "Logo — trzy kropki umieszczone obok siebie — to symbol, który towarzyszy mi przez całe życie. Dla mnie liczba trzy oznacza równowagę. Ten szczegół jest wpleciony we wszystko, co robię: od ręcznie przyszywanych metek na każdym ubraniu, po subtelne elementy ukryte w samych grafikach." },
        { en: "THANK YOU FOR BEING PART OF IT — 3ULT", pl: "DZIĘKUJĘ, ŻE JESTEŚ CZĘŚCIĄ TEGO — 3ULT" },
        { en: "[ socials ]", pl: "[ społeczności ]" },
        { en: "[ go back ]", pl: "[ powrót ]" },
        { en: "Fabric:", pl: "Materiał:" },
        { en: "100% premium heavyweight cotton.", pl: "100% bawełna premium o wysokiej gramaturze." },
        { en: "100% premium cotton.", pl: "100% bawełna premium." },
        { en: "Weight:", pl: "Gramatura:" },
        { en: "240 GSM for a structured, substantial drape.", pl: "240 g/m² zapewniające strukturalne i solidne układanie się materiału." },
        { en: "200 GSM - high quality, fluid drape fabric.", pl: "200 g/m² - wysokiej jakości, lejący się materiał." },
        { en: "Finish:", pl: "Wykończenie:" },
        { en: "High-definition graphics realized via industry-leading DTG technology.", pl: "Grafiki w wysokiej rozdzielczości zrealizowane przy użyciu wiodącej w branży technologii DTG." },
        { en: "Screen-printed graphic using specially formulated ink that retains its color for a long time.", pl: "Grafika wykonana sitodrukiem przy użyciu specjalnie opracowanej farby, która długo zachowuje swój kolor." },
        { en: "Fit:", pl: "Krój:" },
        { en: "Boxy cut with dropped shoulders.", pl: "Pudełkowy krój z obniżoną linią ramion." },
        { en: "Ultra Boxy cut with dropped shoulders.", pl: "Krój Ultra Boxy z obniżoną linią ramion." },
        { en: "Details:", pl: "Detale:" },
        { en: "Individually hand-painted and sewn-in labels, paired with DTF printed care tags.", pl: "Indywidualnie ręcznie malowane i wszywane metki, w połączeniu z drukowanymi w technologii DTF metkami pielęgnacyjnymi." },
        { en: "Individually hand-painted and sewn-in labels, paired with iconic DTF printed care tags and distressed material.", pl: "Indywidualnie ręcznie malowane i wszywane metki, w połączeniu z kultowymi drukowanymi w technologii DTF metkami pielęgnacyjnymi i postarzanym materiałem." },
        { en: "hide description", pl: "ukryj opis" },
        { en: "show description", pl: "pokaż opis" },
        { en: "show sizechart", pl: "pokaż tabelę rozmiarów" },
        { en: "hide sizechart", pl: "ukryj tabelę rozmiarów" },
        { en: "Buy / check size availability", pl: "Kup / sprawdź dostępność rozmiarów" },
        { en: "hide size availability", pl: "ukryj dostępność rozmiarów" },
        { en: "[ return ]", pl: "[ powrót ]" },
        { en: "[ sold out ]", pl: "[ wyprzedane ]" },
        { en: "[ be patient... ]", pl: "[ bądź cierpliwy... ]" },
        { en: "[ buy ]", pl: "[ kup ]" },
        { en: "about...", pl: "o nas..." },
        { en: "terms & privacy", pl: "regulamin" },
        { en: "* website in development", pl: "* strona w budowie" },
        { en: "is breathing again...", pl: "znów oddycha..." },
        { en: "We'll be back soon.", pl: "Wkrótce wrócimy." },
        { en: "be part of it", pl: "bądź częścią tego" },
        { en: "VESSEL 1 IS LIVE!", pl: "VESSEL 1 JEST DOSTĘPNY!" },
        { en: "days", pl: "dni" },
        { en: "hours", pl: "godz" },
        { en: "mins", pl: "min" },
        { en: "secs", pl: "sek" },
        { en: "[ click to explore & buy ]", pl: "[ kliknij by odkryć i kupić ]" },
        { en: "3ULT /// 2026 /// JUNE", pl: "3ULT /// 2026 /// CZERWIEC" }
    ];

    // 4. Silnik bezinwazyjnej zamiany (nie psuje żadnych Twoich div'ów i tagów span)
    function translateNode(node, lang) {
        if (node.nodeType === 3) {
            let text = node.nodeValue.trim();
            if (!text) return;
            
            let entry = dict.find(d => d.en === text || d.pl === text);
            if (entry) {
                node.nodeValue = node.nodeValue.replace(text, lang === 'pl' ? entry.pl : entry.en);
            } else {
                // Logika dla dynamicznych rozmiarów (np. Size S / Rozmiar S)
                if (text.startsWith("Size ")) {
                    if (lang === 'pl') node.nodeValue = node.nodeValue.replace("Size ", "Rozmiar ");
                } else if (text.startsWith("Rozmiar ")) {
                    if (lang === 'en') node.nodeValue = node.nodeValue.replace("Rozmiar ", "Size ");
                }
            }
        } else if (node.nodeType === 1 && node.nodeName !== 'SCRIPT' && node.nodeName !== 'STYLE') {
            for (let i = 0; i < node.childNodes.length; i++) {
                translateNode(node.childNodes[i], lang);
            }
        }
    }

    // 5. Rozprowadzanie nowego języka po całej stronie
    function applyLanguage(lang) {
        if (lang === 'pl') {
            checkbox.checked = true;
            enLabel.classList.remove('active');
            plLabel.classList.add('active');
        } else {
            checkbox.checked = false;
            plLabel.classList.remove('active');
            enLabel.classList.add('active');
        }
        
        translateNode(document.body, lang);
        
        // Aktualizacja buttonów rozwijających zawartość (odkryte / zakryte opcje zależące od stanu w CSS)
        const descBtn = document.getElementById('toggle-description');
        const sizechartBtn = document.getElementById('toggle-sizechart');
        const availabilityBtn = document.getElementById('toggle-availability');
        
        if (descBtn) {
            const descWrapper = document.getElementById('desc-wrapper');
            if (descWrapper && descWrapper.classList.contains('active')) {
                descBtn.textContent = lang === 'pl' ? 'ukryj opis' : 'hide description';
            } else {
                descBtn.textContent = lang === 'pl' ? 'pokaż opis' : 'show description';
            }
        }
        
        if (sizechartBtn) {
            const sizeWrapper = document.getElementById('sizechart-wrapper');
            if (sizeWrapper && sizeWrapper.classList.contains('active')) {
                sizechartBtn.textContent = lang === 'pl' ? 'ukryj tabelę rozmiarów' : 'hide sizechart';
            } else {
                sizechartBtn.textContent = lang === 'pl' ? 'pokaż tabelę rozmiarów' : 'show sizechart';
            }
        }
        
        if (availabilityBtn) {
            const avWrapper = document.getElementById('availability-wrapper');
            if (avWrapper && avWrapper.classList.contains('active')) {
                availabilityBtn.textContent = lang === 'pl' ? 'ukryj dostępność rozmiarów' : 'hide size availability';
            } else {
                availabilityBtn.textContent = lang === 'pl' ? 'Kup / sprawdź dostępność rozmiarów' : 'Buy / check size availability';
            }
        }
    }

    // 6. Nasłuchiwanie manualnego kliknięcia na tekst
    checkbox.addEventListener('change', (e) => {
        const lang = e.target.checked ? 'pl' : 'en';
        localStorage.setItem('3ult_lang', lang);
        applyLanguage(lang);
    });

    enLabel.addEventListener('click', () => { checkbox.checked = false; checkbox.dispatchEvent(new Event('change')); });
    plLabel.addEventListener('click', () => { checkbox.checked = true; checkbox.dispatchEvent(new Event('change')); });

    // 7. Ładowanie uprzednio wybranego języka po przejściu z innej podstrony
    const savedLang = localStorage.getItem('3ult_lang') || 'en';
    setTimeout(() => { applyLanguage(savedLang); }, 50);

    // 8. Obserwator do tłumaczenia Twoich zmieniających się elementów co 1 sekundę (odliczanie, pasek inventory)
    const observer = new MutationObserver((mutations) => {
        const currentLang = checkbox.checked ? 'pl' : 'en';
        if (currentLang === 'en') return; 
        
        mutations.forEach(mutation => {
            if (mutation.addedNodes.length) {
                mutation.addedNodes.forEach(node => {
                    if (node.nodeType === 1 && node.id !== 'lang-toggle-wrapper') {
                       translateNode(node, currentLang);
                    }
                });
            }
        });
    });
    observer.observe(document.body, { childList: true, subtree: true });

})();
</script>
</body>
</html>
